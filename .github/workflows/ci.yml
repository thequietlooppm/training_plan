name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Recursive + --if-present (not hardcoded `cd apps/web && ...` steps)
      # so any future packages/* package is picked up automatically, with
      # zero edits to this file — as long as it names its scripts
      # lint/typecheck/test/build, same as apps/web and apps/api.
      - run: pnpm -r --if-present run lint

      - run: pnpm -r --if-present run typecheck

      - run: pnpm -r --if-present run test

      - run: pnpm -r --if-present run build
